{% extends 'culturas/base.html' %}

{% block titulo %}Excluir Cultura | FarmTech Solutions{% endblock %}

{% block conteudo %}
    <div class="form-card">
        <h1>Excluir Cultura</h1>
        <p>Tem certeza que deseja excluir a cultura <strong>{{ cultura.nome }}</strong>? Essa ação não pode ser desfeita.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <a href="{% url 'home' %}" class="btn btn-outline">Cancelar</a>
                <button type="submit" class="btn btn-danger">Sim, excluir</button>
            </div>
        </form>
    </div>
{% endblock %}
